[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-childcare-100k-threshold"
version = "0.1.0"
description = "Removing the £100,000 income limit on 30 funded hours and Tax-Free Childcare: a PolicyEngine UK costing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=1.26",
  # The Microcosm release (datasets.py) pins policyengine-uk 2.147.2 and
  # policyengine-core 3.33.3 exactly in its manifest; no policyengine.py release
  # bundles that model version yet (6.10.2 bundles 2.132.6), so both are pinned
  # here and policyengine.py is installed without its [uk] extra, which would pin
  # a different policyengine-uk.
  "policyengine==6.10.2",
  "policyengine-core==3.33.3",
  "policyengine-uk==2.147.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
childcare-100k-build = "childcare_100k.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/childcare_100k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
